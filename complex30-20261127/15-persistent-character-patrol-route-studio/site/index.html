<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Patrol Route Studio</title>
    <script type="module" crossorigin src="/web3dbench-autumn-joys/complex30-20261127/15-persistent-character-patrol-route-studio/site/assets/index-CQUVKeuG.js"></script>
    <link rel="stylesheet" crossorigin href="/web3dbench-autumn-joys/complex30-20261127/15-persistent-character-patrol-route-studio/site/assets/index-BfL1uxAM.css">
  </head>
  <body>
    <div id="app">
      <canvas id="viewport" aria-label="3D patrol route scene"></canvas>
      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>Patrol Route Studio</h1>
            <p>Route A–B–C · <span id="mode-label">Walk</span></p>
          </div>
        </div>
        <div class="transport">
          <button id="play" class="primary" type="button">Play</button>
          <button id="walk" type="button" aria-pressed="true">Walk</button>
          <button id="run" type="button" aria-pressed="false">Run</button>
        </div>
      </header>

      <aside class="panel" aria-labelledby="telemetry-heading">
        <div class="panel-heading">
          <h2 id="telemetry-heading">Live telemetry</h2>
          <span id="status-pill" class="pill idle">Idle</span>
        </div>
        <dl class="telemetry">
          <div><dt>Position</dt><dd id="pos">−3.00, 0.00</dd></div>
          <div><dt>Target</dt><dd id="target">B</dd></div>
          <div><dt>Heading</dt><dd id="yaw">0.0°</dd></div>
          <div><dt>Distance</dt><dd id="distance">0.00 m</dd></div>
          <div><dt>Steps</dt><dd id="steps">0</dd></div>
          <div><dt>Speed</dt><dd id="speed">2.00 m/s</dd></div>
        </dl>
        <p class="hint">Drag to orbit · Scroll to zoom</p>
      </aside>

      <section class="waypoints" aria-labelledby="waypoints-heading">
        <div class="section-title">
          <h2 id="waypoints-heading">Waypoints</h2>
          <span>meters</span>
        </div>
        <div class="waypoint-grid">
          <label>A <span class="axis">X</span><input id="ax" type="number" step="0.1" value="-3" /></label>
          <label><span class="axis">Z</span><input id="az" type="number" step="0.1" value="0" /></label>
          <label>B <span class="axis">X</span><input id="bx" type="number" step="0.1" value="3" /></label>
          <label><span class="axis">Z</span><input id="bz" type="number" step="0.1" value="0" /></label>
          <label>C <span class="axis">X</span><input id="cx" type="number" step="0.1" value="3" /></label>
          <label><span class="axis">Z</span><input id="cz" type="number" step="0.1" value="4" /></label>
        </div>
        <div class="actions">
          <button id="save" type="button">Save</button>
          <button id="load" type="button">Load</button>
          <button id="reset" class="danger" type="button">Reset</button>
        </div>
        <p id="message" class="message" role="status" aria-live="polite">Ready to patrol.</p>
      </section>

      <div class="legend" aria-hidden="true">
        <span><i class="dot a"></i>A</span>
        <span><i class="dot b"></i>B</span>
        <span><i class="dot c"></i>C</span>
      </div>
    </div>
  </body>
</html>
