<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071116" />
    <title>Orbital Feedback Laboratory</title>
    <script type="module" crossorigin src="/web3dbench-autumn-joys/complex30-20261127/01-persistent-orbital-feedback-laboratory/site/assets/index-D2hJf2TL.js"></script>
    <link rel="stylesheet" crossorigin href="/web3dbench-autumn-joys/complex30-20261127/01-persistent-orbital-feedback-laboratory/site/assets/index-0Tmlmshp.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Three-body motion study / station 07</p>
          <h1>Orbital Feedback <em>Laboratory</em></h1>
        </div>
        <p class="status-mark"><span></span> Local simulation</p>
      </header>
      <section class="workspace">
        <div class="viewport-frame">
          <div id="viewport" aria-label="Interactive orbital feedback simulation"></div>
          <div class="viewport-label">Vector field / live</div>
          <div class="crosshair" aria-hidden="true"></div>
        </div>
        <aside class="console">
          <div class="readout">
            <div class="readout-heading"><span>Telemetry</span><span class="pulse-dot"></span></div>
            <dl>
              <div><dt>Frame</dt><dd id="frame-readout">000000</dd></div>
              <div><dt>Sim time</dt><dd id="time-readout">0.0000 <small>s</small></dd></div>
              <div><dt>Mode</dt><dd id="paused-readout">Running</dd></div>
              <div><dt>Selection</dt><dd id="selected-readout">None</dd></div>
            </dl>
          </div>
          <div class="legend">
            <p class="section-label">Probe channels</p>
            <div id="legend-list"></div>
          </div>
          <div class="controls">
            <p class="section-label">Operations</p>
            <div class="button-grid">
              <button id="pause-button" type="button"><span id="pause-icon">Ⅱ</span><span id="pause-label">Pause</span></button>
              <button id="save-button" type="button"><span>↓</span>Save</button>
              <button id="load-button" type="button"><span>↑</span>Load</button>
              <button id="reset-button" class="danger" type="button"><span>↺</span>Reset</button>
            </div>
            <p id="notice" class="notice" role="status" aria-live="polite">Click a probe to select it.</p>
          </div>
          <p class="tip">Drag to orbit · Scroll to zoom · Right-drag to pan</p>
        </aside>
      </section>
    </main>
  </body>
</html>
