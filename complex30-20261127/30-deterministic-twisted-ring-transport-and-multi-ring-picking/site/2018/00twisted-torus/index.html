<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WTY198QNED"></script>
    <script src="../../ga.js"></script>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>Twisted Torus</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        overflow: hidden;
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        font-size: 13px;
        line-height: 20px;
        color: #333;
        background: #bbb;
      }

      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 210px;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 4px;
        color: #fff;
        background: rgba(38, 35, 55, 0.78);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        font-family: monospace;
        line-height: 18px;
        pointer-events: none;
      }

      #status strong {
        display: block;
        margin-bottom: 3px;
        font-size: 13px;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>

  <body>
    <div id="status" aria-live="polite">
      <strong>Twisted Torus Lab</strong>
      <div class="status-row"><span>State</span><span id="status-running">running</span></div>
      <div class="status-row"><span>Speed</span><span id="status-speed">1x</span></div>
      <div class="status-row"><span>Sim time</span><span id="status-time">0.000</span></div>
      <div class="status-row"><span>Steps</span><span id="status-steps">0</span></div>
      <div class="status-row"><span>Selected</span><span id="status-selected">none</span></div>
      <div>Space: pause/run &nbsp; [ ]: speed</div>
    </div>

    <div id="container"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/",
          "jpalette": "https://cdn.jsdelivr.net/npm/jpalette@1.0.4/src/index.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
      import * as jPalette from 'jpalette';

      const container = document.getElementById('container');

      const scene = new THREE.Scene();

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setClearColor(0x686481, 1);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100000);
      camera.position.set(0, 1.6, 3);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.screenSpacePanning = true;
      controls.target.y = 1.6;

      const aLight = new THREE.AmbientLight(0x666666);
      scene.add(aLight);

      const dLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dLight.position.set(0, 1, 1);
      scene.add(dLight);

      // var gh = new THREE.GridHelper( 2, 10, 0x000000, 0x808080 );
      // scene.add( gh );

      // --------------------------------------------------------------

      const boxGeo = new RoundedBoxGeometry(0.12, 0.5, 0.5, 2, 0.025);

      class Ring extends THREE.Group {
        // options: numBoxes, multiplier, colors
        constructor({
          numBoxes = 70,
          multiplier = 1,
          colors = [
            new jPalette.Color(150, 77, 218, 255), // purple
            new jPalette.Color(63, 123, 213, 255), // blue
            new jPalette.Color(212, 86, 214, 255), // pink
            new jPalette.Color(150, 77, 218, 255), // purple
          ],
        } = {}) {
          super();

          const scope = this;

          const colorPalette = new jPalette.ColorMap(numBoxes, colors);

          scope.boxes = [];

          for (let i = 0; i < numBoxes; i++) {
            const boxParent = new THREE.Group();
            boxParent.up.set(0, 0, 1);

            const angle = (i / numBoxes) * Math.PI * 2;
            boxParent.position.x = Math.cos(angle);
            boxParent.position.y = Math.sin(angle);

            boxParent.lookAt(scene.position);

            const color = colorPalette.map[i].rgb();
            const material = new THREE.MeshPhongMaterial({
              color: new THREE.Color(color),
              specular: 0x333333,
              shininess: 40,
            });

            const box = new THREE.Mesh(boxGeo, material);
            boxParent.add(box);

            box.rotation.x = -angle * multiplier;

            scope.add(boxParent);
            scope.boxes.push(box);
          }
        }

        update(speed) {
          for (let i = 0; i < this.boxes.length; i++) {
            this.boxes[i].rotation.x -= 0.01 * speed;
          }
        }
      }

      //

      const ring = new Ring();
      scene.add(ring);
      ring.position.y = 1.5;

      const ring2 = new Ring({ numBoxes: 80, multiplier: 2 });
      scene.add(ring2);
      ring2.position.y = 1.5;
      ring2.position.x = 3;

      const ring3 = new Ring({ multiplier: 0.25 });
      scene.add(ring3);
      ring3.position.y = 1.5;
      ring3.position.x = -3;

      const rings = [ring, ring2, ring3];

      // --------------------------------------------------------------

      const fixedDt = 1 / 60;
      const speeds = [0.25, 0.5, 1, 2, 4];
      const initialRotations = [];
      const ringIds = ['ring', 'ring2', 'ring3'];
      let simTime = 0;
      let stepCount = 0;
      let speed = 1;
      let running = true;
      let accumulator = 0;
      let previousNow = null;
      let selectedRing = null;

      for (let i = 0; i < rings.length; i++) {
        initialRotations.push(rings[i].boxes.map((box) => box.rotation.x));
      }

      const currentRunningText = document.getElementById('status-running');
      const currentSpeedText = document.getElementById('status-speed');
      const currentTimeText = document.getElementById('status-time');
      const currentStepsText = document.getElementById('status-steps');
      const currentSelectedText = document.getElementById('status-selected');

      function updateStatus() {
        currentRunningText.textContent = running ? 'running' : 'paused';
        currentSpeedText.textContent = speed + 'x';
        currentTimeText.textContent = simTime.toFixed(3);
        currentStepsText.textContent = String(stepCount);
        currentSelectedText.textContent = selectedRing === null ? 'none' : selectedRing;
      }

      function simulateStep() {
        for (let i = 0; i < rings.length; i++) {
          rings[i].update(speed);
        }
        stepCount += 1;
        simTime += fixedDt;
      }

      function setRunning(value) {
        if (typeof value !== 'boolean') {
          return;
        }
        running = value;
        accumulator = 0;
        updateStatus();
      }

      function setSpeed(value) {
        if (!speeds.includes(value)) {
          return;
        }
        speed = value;
        updateStatus();
      }

      function step(n) {
        if (!Number.isInteger(n) || n < 0 || n > 600 || running) {
          return;
        }
        for (let i = 0; i < n; i++) {
          simulateStep();
        }
        updateStatus();
      }

      function clearHover() {
        if (INTERSECTED) {
          INTERSECTED.material.emissive.setHex(INTERSECTED.currentHex);
        }
        INTERSECTED = null;
      }

      function reset() {
        for (let i = 0; i < rings.length; i++) {
          for (let j = 0; j < rings[i].boxes.length; j++) {
            rings[i].boxes[j].rotation.x = initialRotations[i][j];
          }
        }
        simTime = 0;
        stepCount = 0;
        speed = 1;
        running = false;
        accumulator = 0;
        selectedRing = null;
        clearHover();
        updateStatus();
      }

      function getState() {
        return {
          running,
          speed,
          simTime,
          stepCount,
          selectedRing,
          rotations: rings.map((item) => item.boxes.map((box) => box.rotation.x)),
        };
      }

      window.torusLab = { getState, setRunning, setSpeed, step, reset };

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let INTERSECTED;

      const allBoxes = rings.reduce((boxes, item) => boxes.concat(item.boxes), []);

      function raycast() {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(allBoxes);
        if (intersects.length > 0) {
          if (INTERSECTED != intersects[0].object) {
            if (INTERSECTED) {
              INTERSECTED.material.emissive.setHex(INTERSECTED.currentHex);
            }
            INTERSECTED = intersects[0].object;
            INTERSECTED.currentHex = INTERSECTED.material.emissive.getHex();
            INTERSECTED.material.emissive.setHex(0xff0000);
          }
        } else {
          if (INTERSECTED) {
            INTERSECTED.material.emissive.setHex(INTERSECTED.currentHex);
          }
          INTERSECTED = null;
        }
      }

      document.addEventListener('mousemove', mousemove, false);
      function mousemove(event) {
        event.preventDefault();
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      }

      renderer.domElement.addEventListener('click', click, false);
      function click(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(allBoxes);
        selectedRing = null;
        if (intersects.length > 0) {
          for (let i = 0; i < rings.length; i++) {
            let found = false;
            for (let j = 0; j < rings[i].boxes.length; j++) {
              if (rings[i].boxes[j] === intersects[0].object) {
                selectedRing = ringIds[i];
                found = true;
                break;
              }
            }
            if (found) {
              break;
            }
          }
        }
        updateStatus();
      }

      document.addEventListener('keydown', keydown, false);
      function keydown(event) {
        if (event.code === 'Space') {
          event.preventDefault();
          setRunning(!running);
        } else if (event.code === 'BracketLeft' || event.code === 'BracketRight') {
          event.preventDefault();
          const index = speeds.indexOf(speed);
          const nextIndex = Math.max(0, Math.min(speeds.length - 1, index + (event.code === 'BracketLeft' ? -1 : 1)));
          setSpeed(speeds[nextIndex]);
        }
      }

      // --------------------------------------------------------------

      window.addEventListener('resize', resize, false);
      function resize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      renderer.setAnimationLoop(loop);

      function loop(now) {
        if (previousNow === null) {
          previousNow = now;
        }

        if (running) {
          accumulator += Math.min((now - previousNow) / 1000, 0.1);
          while (accumulator >= fixedDt) {
            simulateStep();
            accumulator -= fixedDt;
          }
        }

        previousNow = now;

        updateStatus();

        raycast();

        if (controls.enabled) {
          controls.update();
        }

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
