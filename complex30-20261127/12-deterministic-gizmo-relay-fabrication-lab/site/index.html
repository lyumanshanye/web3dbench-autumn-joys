<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/web3dbench-autumn-joys/complex30-20261127/12-deterministic-gizmo-relay-fabrication-lab/site/favicon.svg" type="image/svg+xml" />
    <title>Gizmo Relay Lab</title>
    <script type="module" crossorigin src="/web3dbench-autumn-joys/complex30-20261127/12-deterministic-gizmo-relay-fabrication-lab/site/assets/index-DucEZeEc.js"></script>
    <link rel="stylesheet" crossorigin href="/web3dbench-autumn-joys/complex30-20261127/12-deterministic-gizmo-relay-fabrication-lab/site/assets/index-BwGkLo_r.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Interactive 3D relay pod scene"></canvas>
      <header class="titlecard">
        <p class="eyebrow">Spatial systems bench / 01</p>
        <h1>Gizmo<br />Relay Lab</h1>
        <p class="hint">Click a pod to select it.<br />Drag a gizmo arrow to move.</p>
      </header>
      <section class="telemetry" aria-label="Selection readout">
        <span class="label">Selected pod</span>
        <strong id="selected-id">alpha</strong>
      </section>
      <section class="transport" aria-label="Playback controls">
        <div class="transport-heading">
          <span class="label">Relay sweep</span>
          <output id="time-readout">0.00 s</output>
        </div>
        <input id="time-slider" type="range" min="0" max="4" step="0.01" value="0" aria-label="Timeline position" />
        <div class="ticks" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4 s</span></div>
      </section>
      <nav class="actions" aria-label="Scene controls">
        <div class="action-row">
          <button id="focus-button" type="button">Focus</button>
          <button id="play-button" type="button">Play</button>
        </div>
        <div class="action-row secondary">
          <button id="dock-button" type="button">Dock</button>
          <button id="undock-button" type="button">Undock</button>
          <button id="reset-button" type="button">Reset</button>
        </div>
      </nav>
      <p class="legend">X <i class="x"></i> &nbsp; Y <i class="y"></i> &nbsp; Z <i class="z"></i></p>
    </div>
  </body>
</html>
