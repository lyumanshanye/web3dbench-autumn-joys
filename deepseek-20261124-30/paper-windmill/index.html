<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c7ebf1" />
    <meta
      name="description"
      content="A playful paper windmill you can spin with the breeze."
    />
    <title>Paper Pinwheel — A Little Breeze</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three/three.module.js",
          "three/addons/": "../../vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div class="sky-decor" aria-hidden="true">
      <div class="sun-disc"></div>
      <div class="sky-ring sky-ring--one"></div>
      <div class="sky-ring sky-ring--two"></div>
    </div>

    <main class="stage">
      <canvas
        id="scene"
        aria-label="A colorful paper windmill standing on rolling green hills"
      ></canvas>
    </main>

    <header class="intro">
      <div class="brand" aria-label="Paper Pinwheel">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
        <span>Paper Pinwheel</span>
      </div>
      <h1>Catch a little breeze.</h1>
      <p>Set the wind, pick a paper palette, and watch it twirl.</p>
    </header>

    <section class="control-panel" aria-label="Windmill controls">
      <div class="speed-control">
        <div class="control-heading">
          <label for="wind-speed">Wind speed</label>
          <output id="wind-value" for="wind-speed">Breezy · 22 km/h</output>
        </div>
        <div class="slider-row">
          <svg class="wind-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 8.5h11.5a3 3 0 1 0-3-3" />
            <path d="M3 12.5h16a2.5 2.5 0 1 1-2.5 2.5" />
            <path d="M3 16.5h6" />
          </svg>
          <input
            id="wind-speed"
            type="range"
            min="0"
            max="100"
            value="58"
            step="1"
            aria-describedby="wind-scale"
          />
        </div>
        <div class="wind-scale" id="wind-scale">
          <span>Calm</span>
          <span>Gusty</span>
        </div>
      </div>

      <div class="control-actions">
        <fieldset class="palette-control">
          <legend>Blade colors</legend>
          <div class="palette-list" role="radiogroup" aria-label="Blade color palette">
            <button
              class="palette is-selected"
              type="button"
              role="radio"
              aria-checked="true"
              data-palette="orchard"
              aria-label="Orchard palette: coral, marigold, leaf, and sky"
            >
              <span class="palette-dots" aria-hidden="true">
                <i style="--dot: #ff7968"></i>
                <i style="--dot: #ffc857"></i>
                <i style="--dot: #74bd8d"></i>
                <i style="--dot: #62b6d7"></i>
              </span>
              <span class="palette-name">Orchard</span>
            </button>
            <button
              class="palette"
              type="button"
              role="radio"
              aria-checked="false"
              data-palette="candy"
              aria-label="Candy palette: raspberry, pink, lavender, and lemon"
            >
              <span class="palette-dots" aria-hidden="true">
                <i style="--dot: #f05d89"></i>
                <i style="--dot: #ffa5bb"></i>
                <i style="--dot: #b58bd8"></i>
                <i style="--dot: #ffd166"></i>
              </span>
              <span class="palette-name">Candy</span>
            </button>
            <button
              class="palette"
              type="button"
              role="radio"
              aria-checked="false"
              data-palette="lagoon"
              aria-label="Lagoon palette: deep teal, seafoam, mist, and gold"
            >
              <span class="palette-dots" aria-hidden="true">
                <i style="--dot: #1c858d"></i>
                <i style="--dot: #59c3b3"></i>
                <i style="--dot: #b6dde0"></i>
                <i style="--dot: #f4b942"></i>
              </span>
              <span class="palette-name">Lagoon</span>
            </button>
            <button
              class="palette"
              type="button"
              role="radio"
              aria-checked="false"
              data-palette="meadow"
              aria-label="Meadow palette: fern, sage, oat, and apricot"
            >
              <span class="palette-dots" aria-hidden="true">
                <i style="--dot: #5f8d4e"></i>
                <i style="--dot: #a6c48a"></i>
                <i style="--dot: #eadbb8"></i>
                <i style="--dot: #ee9b63"></i>
              </span>
              <span class="palette-name">Meadow</span>
            </button>
          </div>
        </fieldset>

        <button
          class="pause-button"
          id="pause-button"
          type="button"
          aria-pressed="false"
          aria-label="Pause windmill animation"
        >
          <span class="pause-icon" aria-hidden="true">
            <svg class="icon-pause" viewBox="0 0 24 24">
              <rect x="6.5" y="5" width="4" height="14" rx="1.4" />
              <rect x="13.5" y="5" width="4" height="14" rx="1.4" />
            </svg>
            <svg class="icon-play" viewBox="0 0 24 24">
              <path d="M8.2 5.7v12.6c0 .9 1 1.4 1.7.9l9-6.3a1.1 1.1 0 0 0 0-1.8l-9-6.3a1.1 1.1 0 0 0-1.7.9Z" />
            </svg>
          </span>
          <span id="pause-label">Pause</span>
        </button>
      </div>
    </section>

    <p class="sr-only" id="live-region" aria-live="polite"></p>
    <noscript>
      <p class="noscript-note">This paper windmill needs JavaScript to spin.</p>
    </noscript>

    <script type="module" src="./main.js"></script>
  </body>
</html>
