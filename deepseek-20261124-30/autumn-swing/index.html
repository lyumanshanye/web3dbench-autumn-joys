<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8d9581" />
    <meta
      name="description"
      content="Autumn Joys — a cozy low-poly autumn neighborhood built with Three.js."
    />
    <title>Autumn Joys</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three/three.module.js",
          "three/addons/": "../../vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-hidden="true"></canvas>

      <div class="sun-haze" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="masthead">
        <div class="brand">
          <svg class="brand-leaf" viewBox="0 0 28 28" aria-hidden="true">
            <path d="M23.8 4.3C14 4.5 6.9 9.7 6.2 17.2c-.2 2.1.5 4 1.6 5.1 1.2 1.2 3.2 1.6 5.1 1.1 7.1-1.8 10.5-9 10.9-19.1Z" />
            <path d="M4.5 25.1c3.6-6.3 8.2-10.7 14.1-14" />
          </svg>
          <span>Maple Grove</span>
        </div>
        <div class="masthead-meta">
          <span class="weather-dot" aria-hidden="true"></span>
          <span>Golden hour&nbsp;&nbsp;·&nbsp;&nbsp;17°C</span>
        </div>
      </header>

      <main class="hero-copy">
        <p class="eyebrow"><span></span>A small seasonal story</p>
        <h1 aria-label="Autumn Joys"><span>Autumn</span><em>Joys</em></h1>
        <p class="intro">Crisp air, amber leaves, and a little time to sway.</p>
      </main>

      <div class="scene-index" aria-hidden="true">
        <span class="index-line"></span>
        <span>Neighborhood swing</span>
        <span class="index-number">No. 04</span>
      </div>

      <div class="pointer-hint" aria-hidden="true">
        <span class="pointer-icon"><i></i></span>
        <span>Move to wander</span>
      </div>

      <footer class="footer">
        <span>43°N&nbsp;&nbsp;·&nbsp;&nbsp;Late October</span>
        <span class="footer-quote">Let the season slow you down.</span>
      </footer>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
