<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7d79b">
  <title>Pelican Coast — A Slow Ride</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #123e49;
      --paper: #fff7e8;
      --coral: #f16d55;
      --sun: #ffc74f;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #8fdcf2;
      font-family: "Avenir Next", "Trebuchet MS", "Gill Sans", sans-serif;
    }

    #app,
    #app canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #app canvas { touch-action: none; }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(17, 67, 80, .08), transparent 18%, transparent 78%, rgba(87, 51, 21, .12)),
        radial-gradient(circle at 50% 47%, transparent 58%, rgba(13, 52, 60, .10) 120%);
      mix-blend-mode: multiply;
      z-index: 2;
    }

    .brand {
      position: fixed;
      top: clamp(22px, 5vw, 52px);
      left: clamp(22px, 5.5vw, 76px);
      z-index: 3;
      pointer-events: none;
      color: var(--ink);
      filter: drop-shadow(0 1px 0 rgba(255, 250, 235, .45));
      animation: arrive 1.1s cubic-bezier(.2, .8, .2, 1) both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .23em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 2px;
      border-radius: 99px;
      background: var(--coral);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 5.1vw, 78px);
      font-weight: 400;
      line-height: .84;
      letter-spacing: -.055em;
    }

    h1 em {
      position: relative;
      display: inline-block;
      padding-right: .07em;
      color: #f6f0dc;
      font-weight: 400;
      text-shadow: 0 2px 20px rgba(55, 46, 19, .12);
    }

    h1 em::after {
      content: "";
      position: absolute;
      left: .03em;
      right: .02em;
      bottom: -.09em;
      height: .07em;
      border-radius: 99px;
      background: var(--coral);
      transform: rotate(-2deg);
    }

    .coordinate {
      margin-top: 18px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .18em;
      opacity: .72;
      text-transform: uppercase;
    }

    .stamp {
      position: fixed;
      right: clamp(20px, 4.5vw, 62px);
      bottom: clamp(20px, 4.5vw, 54px);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 13px 9px 10px;
      border: 1px solid rgba(18, 62, 73, .18);
      border-radius: 99px;
      color: rgba(18, 62, 73, .82);
      background: rgba(255, 247, 232, .58);
      box-shadow: 0 8px 30px rgba(74, 48, 24, .08);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
      pointer-events: none;
      animation: arrive 1.1s .25s cubic-bezier(.2, .8, .2, 1) both;
    }

    .stamp-sun {
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 0 0 0 5px rgba(255, 199, 79, .16);
    }

    .stamp-sun::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: inherit;
      background: #fff7e8;
      opacity: .52;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      background: #f7d79b;
      transition: opacity .7s ease, visibility .7s ease;
    }

    .loading span {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(18, 62, 73, .16);
      border-top-color: var(--coral);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .loading.is-gone {
      visibility: hidden;
      opacity: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 620px) {
      .brand { top: 24px; left: 22px; }
      .eyebrow { margin-bottom: 9px; font-size: 8px; letter-spacing: .18em; }
      h1 { font-size: 42px; }
      .coordinate { margin-top: 14px; font-size: 8px; }
      .stamp { right: 18px; bottom: 18px; padding: 7px 11px 7px 8px; font-size: 8px; }
      .stamp-sun { width: 24px; height: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand, .stamp { animation: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../../vendor/three/three.module.js",
        "three/addons/": "../../vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app" aria-label="A pelican riding a bicycle along a sunny beach"></div>
  <div class="vignette"></div>

  <header class="brand">
    <div class="eyebrow">Pelican Cove · Beach Cruise</div>
    <h1>A Slow<br><em>Ride</em></h1>
    <div class="coordinate">36° 14′ N &nbsp;·&nbsp; Tide: low &nbsp;·&nbsp; 11:42 AM</div>
  </header>

  <div class="stamp">
    <span class="stamp-sun" aria-hidden="true"></span>
    <span>Sunny all day</span>
  </div>

  <div class="loading" id="loading"><span aria-label="Loading scene"></span></div>

  <script type="module">
    import * as THREE from 'three';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const app = document.querySelector('#app');
    const loading = document.querySelector('#loading');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xf7dcb4, 0.0085);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 420);
    let cameraBase = new THREE.Vector3(6.2, 3.55, 8.4);
    const lookTarget = new THREE.Vector3(0.05, 1.95, 0);
    camera.position.copy(cameraBase);
    camera.lookAt(lookTarget);

    const clock = new THREE.Clock();
    const world = new THREE.Group();
    scene.add(world);

    const Y = new THREE.Vector3(0, 1, 0);
    const tempA = new THREE.Vector3();
    const tempB = new THREE.Vector3();
    const tempC = new THREE.Vector3();
    const tempD = new THREE.Vector3();

    function seeded(seed = 1) {
      let value = seed >>> 0;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }
    const random = seeded(33743);

    function standard(color, roughness = 0.62, metalness = 0, options = {}) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness, ...options });
    }

    function makeCanvasTexture(width, height, paint) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      paint(canvas.getContext('2d'), width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    function setShadows(object, cast = true, receive = true) {
      object.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = cast;
          child.receiveShadow = receive;
        }
      });
      return object;
    }

    function cylinderBetween(a, b, radius, material, segments = 10) {
      const delta = tempA.copy(b).sub(a);
      const length = delta.length();
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, segments), material);
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(Y, delta.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function unitSegment(radius, material, segments = 9) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 1, segments), material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function setSegment(mesh, a, b) {
      const delta = tempA.copy(b).sub(a);
      const length = delta.length();
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(Y, delta.normalize());
      mesh.scale.set(1, length, 1);
    }

    function tube(points, radius, material, tubularSegments = 28, radialSegments = 8) {
      const curve = new THREE.CatmullRomCurve3(points);
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false), material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // — Sky and light ————————————————————————————————————————————————
    const sunDirection = new THREE.Vector3(-0.32, 0.20, -0.925).normalize();
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(240, 36, 20),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        uniforms: {
          uTop: { value: new THREE.Color(0x48b9e8) },
          uHorizon: { value: new THREE.Color(0xffe8bc) },
          uLow: { value: new THREE.Color(0xffd09b) },
          uSunDir: { value: sunDirection }
        },
        vertexShader: `
          varying vec3 vWorld;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorld = worldPosition.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 uTop;
          uniform vec3 uHorizon;
          uniform vec3 uLow;
          uniform vec3 uSunDir;
          varying vec3 vWorld;
          void main() {
            vec3 direction = normalize(vWorld);
            float h = direction.y;
            float mixAmount = pow(clamp(h * 1.6 + 0.035, 0.0, 1.0), 0.62);
            vec3 color = mix(uHorizon, uTop, mixAmount);
            color = mix(uLow, color, smoothstep(-0.07, 0.12, h));
            float sunGlow = pow(max(dot(direction, uSunDir), 0.0), 20.0);
            float sunCore = pow(max(dot(direction, uSunDir), 0.0), 520.0);
            color = mix(color, vec3(1.0, 0.90, 0.62), sunGlow * 0.31 + sunCore * 0.74);
            color += vec3(0.22, 0.12, 0.015) * sunGlow * 0.18;
            gl_FragColor = vec4(color, 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `
      })
    );
    sky.frustumCulled = false;
    scene.add(sky);

    const sunPosition = sunDirection.clone().multiplyScalar(180);
    const sunDisc = new THREE.Mesh(
      new THREE.CircleGeometry(4.3, 48),
      new THREE.MeshBasicMaterial({ color: 0xfff6cf, fog: false, depthWrite: false })
    );
    sunDisc.position.copy(sunPosition);
    sunDisc.lookAt(0, 2, 0);
    scene.add(sunDisc);

    const glowTexture = makeCanvasTexture(256, 256, (ctx, w, h) => {
      const gradient = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      gradient.addColorStop(0, 'rgba(255,250,220,0.95)');
      gradient.addColorStop(0.12, 'rgba(255,238,168,0.58)');
      gradient.addColorStop(0.36, 'rgba(255,202,107,0.20)');
      gradient.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
    });
    const sunHalo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture,
      color: 0xfff2bf,
      transparent: true,
      opacity: 0.72,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      fog: false
    }));
    sunHalo.position.copy(sunPosition);
    sunHalo.scale.set(62, 62, 1);
    scene.add(sunHalo);

    const hemi = new THREE.HemisphereLight(0xd8f4ff, 0xf1bb70, 2.25);
    scene.add(hemi);

    const sunlight = new THREE.DirectionalLight(0xfff1c8, 3.15);
    sunlight.position.set(-7, 13, 10);
    sunlight.target.position.set(0, 0, -2);
    sunlight.castShadow = true;
    sunlight.shadow.mapSize.set(Math.min(window.innerWidth, 1500) > 700 ? 2048 : 1024, Math.min(window.innerWidth, 1500) > 700 ? 2048 : 1024);
    sunlight.shadow.camera.left = -9;
    sunlight.shadow.camera.right = 9;
    sunlight.shadow.camera.top = 9;
    sunlight.shadow.camera.bottom = -9;
    sunlight.shadow.camera.near = 1;
    sunlight.shadow.camera.far = 35;
    sunlight.shadow.bias = -0.00025;
    sunlight.shadow.normalBias = 0.028;
    scene.add(sunlight, sunlight.target);

    const oceanFill = new THREE.DirectionalLight(0x83d6f1, 0.85);
    oceanFill.position.set(8, 7, -10);
    scene.add(oceanFill);

    const warmBounce = new THREE.PointLight(0xffc06e, 18, 18, 2);
    warmBounce.position.set(1.5, 1.0, 5);
    scene.add(warmBounce);

    // — Clouds ————————————————————————————————————————————————————————
    const cloudTexture = makeCanvasTexture(512, 256, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      const blobs = [
        [130, 150, 86, 55], [212, 110, 108, 75], [300, 138, 138, 84],
        [390, 154, 78, 51], [244, 172, 154, 50], [338, 175, 95, 38]
      ];
      for (const [x, y, rx, ry] of blobs) {
        const g = ctx.createRadialGradient(x, y, 2, x, y, rx);
        g.addColorStop(0, 'rgba(255,250,233,0.96)');
        g.addColorStop(0.45, 'rgba(255,246,224,0.72)');
        g.addColorStop(1, 'rgba(255,240,212,0)');
        ctx.fillStyle = g;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(1, ry / rx);
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    });
    const clouds = [];
    const cloudData = [
      [-42, 20, -82, 30, 12, 0.54],
      [7, 27, -105, 42, 15, 0.44],
      [44, 18, -84, 31, 11, 0.48],
      [76, 30, -120, 38, 13, 0.34],
      [-82, 31, -125, 44, 15, 0.32],
      [18, 13, -58, 22, 8, 0.28]
    ];
    for (const [x, y, z, sx, sy, opacity] of cloudData) {
      const cloud = new THREE.Sprite(new THREE.SpriteMaterial({
        map: cloudTexture,
        transparent: true,
        opacity,
        depthWrite: false,
        fog: false
      }));
      cloud.position.set(x, y, z);
      cloud.scale.set(sx, sy, 1);
      cloud.userData.baseX = x;
      cloud.userData.speed = 0.025 + random() * 0.035;
      scene.add(cloud);
      clouds.push(cloud);
    }

    // — Beach and ocean ————————————————————————————————————————————————
    const sandTexture = makeCanvasTexture(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#f0c985';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 5200; i++) {
        const tone = random();
        ctx.fillStyle = tone > 0.72
          ? `rgba(255,245,214,${0.06 + random() * 0.11})`
          : `rgba(129,86,44,${0.025 + random() * 0.075})`;
        const size = random() * 1.8 + 0.25;
        ctx.beginPath();
        ctx.arc(random() * w, random() * h, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.lineWidth = 0.7;
      for (let i = 0; i < 24; i++) {
        ctx.strokeStyle = `rgba(255,246,220,${0.018 + random() * 0.025})`;
        ctx.beginPath();
        const y = random() * h;
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(w * .3, y + random() * 14, w * .7, y - random() * 14, w, y + random() * 5);
        ctx.stroke();
      }
    });
    sandTexture.wrapS = sandTexture.wrapT = THREE.RepeatWrapping;
    sandTexture.repeat.set(26, 20);
    sandTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const sandGeometry = new THREE.PlaneGeometry(210, 130, 84, 54);
    sandGeometry.rotateX(-Math.PI / 2);
    const sandPositions = sandGeometry.attributes.position;
    for (let i = 0; i < sandPositions.count; i++) {
      const x = sandPositions.getX(i);
      const z = sandPositions.getZ(i);
      const centerDistance = Math.sqrt(x * x + z * z);
      const dune = THREE.MathUtils.smoothstep(centerDistance, 7, 32);
      const ripple = Math.sin(x * 0.23 + z * 0.11) * 0.12 + Math.sin(z * 0.36 - x * 0.08) * 0.07;
      sandPositions.setY(i, ripple * dune + Math.sin(x * 0.08) * Math.sin(z * 0.075) * dune * 0.22);
    }
    sandGeometry.computeVertexNormals();
    const sand = new THREE.Mesh(sandGeometry, standard(0xffffff, 1, 0, {
      map: sandTexture,
      bumpMap: sandTexture,
      bumpScale: 0.018
    }));
    sand.position.set(0, -0.035, -4);
    sand.receiveShadow = true;
    world.add(sand);

    const wetSand = new THREE.Mesh(
      new THREE.PlaneGeometry(150, 8.2),
      new THREE.MeshPhysicalMaterial({
        color: 0xc98e52,
        roughness: 0.28,
        metalness: 0,
        clearcoat: 0.75,
        clearcoatRoughness: 0.18,
        transparent: true,
        opacity: 0.42,
        depthWrite: false
      })
    );
    wetSand.rotation.x = -Math.PI / 2;
    wetSand.position.set(0, 0.016, -4.8);
    wetSand.receiveShadow = true;
    world.add(wetSand);

    const oceanMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uShallow: { value: new THREE.Color(0x61d5c1) },
        uDeep: { value: new THREE.Color(0x087ca6) },
        uHaze: { value: new THREE.Color(0xf5d6ac) }
      },
      vertexShader: `
        uniform float uTime;
        varying vec3 vWorld;
        varying float vWave;
        void main() {
          vec3 p = position;
          float wave = sin(p.x * 0.16 + uTime * 0.78) * 0.16
                     + sin(p.y * 0.27 - uTime * 0.58 + p.x * 0.05) * 0.12
                     + sin((p.x + p.y) * 0.08 + uTime * 0.36) * 0.09;
          p.z += wave;
          vec4 worldPosition = modelMatrix * vec4(p, 1.0);
          vWorld = worldPosition.xyz;
          vWave = wave;
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uShallow;
        uniform vec3 uDeep;
        uniform vec3 uHaze;
        varying vec3 vWorld;
        varying float vWave;
        void main() {
          float depth = clamp((-vWorld.z - 8.6) / 105.0, 0.0, 1.0);
          vec3 color = mix(uShallow, uDeep, smoothstep(0.03, 0.77, depth));
          float waveA = sin(vWorld.z * 1.48 - uTime * 1.28 + sin(vWorld.x * 0.16) * 2.2 + vWorld.x * 0.06);
          float waveB = sin(vWorld.z * 3.45 + uTime * 0.73 + vWorld.x * 0.31);
          float crest = smoothstep(0.87, 1.0, waveA * 0.67 + waveB * 0.33);
          float nearShore = 1.0 - smoothstep(0.0, 0.22, depth);
          color = mix(color, vec3(0.96, 0.99, 0.94), crest * (0.18 + nearShore * 0.34));
          float sunPath = pow(max(0.0, sin(vWorld.x * 0.11 + 0.9) * sin(vWorld.z * 0.23 - uTime * 0.42)), 9.0);
          color += vec3(1.0, 0.77, 0.39) * sunPath * (1.0 - smoothstep(0.25, 0.8, depth)) * 0.22;
          float haze = smoothstep(0.64, 1.0, depth);
          color = mix(color, uHaze, haze * 0.74);
          gl_FragColor = vec4(color, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `
    });
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(220, 110, 112, 58), oceanMaterial);
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.set(0, -0.16, -64);
    world.add(ocean);

    function foamRibbon(zBase, width, opacity, color = 0xfffdf3) {
      const segments = 180;
      const positions = [];
      const indices = [];
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const x = -70 + t * 140;
        const z = zBase + Math.sin(x * 0.23) * 0.44 + Math.sin(x * 0.57 + 1.4) * 0.13;
        const localWidth = width * (0.7 + 0.3 * Math.sin(x * 0.74) ** 2);
        positions.push(x, 0.035, z - localWidth * 0.5, x, 0.035, z + localWidth * 0.5);
        if (i < segments) {
          const index = i * 2;
          indices.push(index, index + 2, index + 1, index + 2, index + 3, index + 1);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity,
        depthWrite: false,
        side: THREE.DoubleSide
      }));
      world.add(mesh);
      return mesh;
    }
    const foamA = foamRibbon(-8.55, 0.52, 0.66);
    const foamB = foamRibbon(-9.55, 0.22, 0.31, 0xeafaf2);

    // — Small beach details —————————————————————————————————————————————
    const pebbleGeometry = new THREE.DodecahedronGeometry(0.07, 0);
    const pebbleMaterials = [
      standard(0xb88c60, 0.9),
      standard(0xe4c18e, 0.95),
      standard(0xa87855, 0.9),
      standard(0xf2d9ac, 0.95)
    ];
    const pebbles = new THREE.InstancedMesh(pebbleGeometry, pebbleMaterials[0], 110);
    const pebbleMatrix = new THREE.Matrix4();
    const pebbleQuat = new THREE.Quaternion();
    const pebbleScale = new THREE.Vector3();
    for (let i = 0; i < 110; i++) {
      const x = (random() - 0.5) * 34;
      const z = -2 + random() * 15;

    // — Palm tree ————————————————————————————————————————————————————————
    function createFrond(length, width, material) {
      const segments = 12;
      const positions = [];
      const uvs = [];
      const indices = [];
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const centerX = t * length;
        const centerY = 0.34 * Math.sin(t * Math.PI * 1.15) - 0.76 * t * t;
        const halfWidth = width * Math.pow(Math.sin(Math.PI * Math.min(1, t * 0.96 + 0.04)), 0.62) * (1 - 0.35 * t);
        positions.push(centerX, centerY + halfWidth * 0.12, -halfWidth);
        positions.push(centerX, centerY, 0);
        positions.push(centerX, centerY + halfWidth * 0.12, halfWidth);
        uvs.push(t, 0, t, 0.5, t, 1);
        if (i < segments) {
          const n = i * 3;
          indices.push(n, n + 3, n + 1, n + 3, n + 4, n + 1, n + 1, n + 4, n + 2, n + 4, n + 5, n + 2);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, material);
      mesh.castShadow = true;
      return mesh;
    }

    function createPalm(x, z, scale = 1) {
      const group = new THREE.Group();
      const trunkMaterial = standard(0x916038, 0.96);
      const trunkDark = standard(0x6f4529, 0.95);
      const trunkPoints = [
        new THREE.Vector3(0, 0, 0),

        new THREE.Vector3(0.72, 4.05, -0.07),
        new THREE.Vector3(1.03, 4.62, -0.12)
      ];
      for (let i = 0; i < trunkPoints.length - 1; i++) {
        const radius = 0.24 - i * 0.022;
        group.add(cylinderBetween(trunkPoints[i], trunkPoints[i + 1], radius, trunkMaterial, 9));
        if (i > 0) {
          const ring = new THREE.Mesh(new THREE.TorusGeometry(radius + 0.012, 0.018, 5, 14), trunkDark);
          ring.position.copy(trunkPoints[i]);
          ring.rotation.x = Math.PI / 2;
          group.add(ring);
        }
      }
      const crown = trunkPoints[trunkPoints.length - 1].clone();
      const leafMaterials = [standard(0x357d58, 0.86, 0, { side: THREE.DoubleSide }), standard(0x4c9566, 0.88, 0, { side: THREE.DoubleSide }), standard(0x2c6b4d, 0.9, 0, { side: THREE.DoubleSide })];
      for (let i = 0; i < 10; i++) {
        const frond = createFrond(1.8 + random() * 0.7, 0.34 + random() * 0.11, leafMaterials[i % 3]);
        frond.position.copy(crown);
        frond.rotation.y = i * Math.PI * 2 / 10 + random() * 0.2;
        frond.rotation.z = -0.04 + random() * 0.16;
        frond.userData.phase = random() * Math.PI * 2;
        frond.userData.baseRotation = frond.rotation.z;
        group.add(frond);
        group.userData.fronds = group.userData.fronds || [];
        group.userData.fronds.push(frond);
      }
      for (let i = 0; i < 4; i++) {
        const coconut = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), standard(0x6d4527, 0.85));

      group.position.set(x, 0, z);
      group.scale.setScalar(scale);
      setShadows(group, true, true);
      world.add(group);
      return group;

    for (let i = -2; i <= 2; i++) {
      const slat = new THREE.Mesh(new THREE.BoxGeometry(0.63, 0.021, 0.56), standard(0xe6c486, 0.84));
      slat.position.set(0, 0.02 + i * 0.075, 0);
      basket.add(slat);
    }
    const flowerStems = [];
    for (let i = 0; i < 7; i++) {
      const angle = i / 7 * Math.PI * 2;
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.011, 0.55 + random() * 0.22, 6), standard(0x4c8755, 0.8));
      stem.position.set((random() - 0.5) * 0.38, 0.39, (random() - 0.5) * 0.32);
      stem.rotation.z = (random() - 0.5) * 0.38;
      stem.rotation.x = (random() - 0.5) * 0.3;
      basket.add(stem);
      flowerStems.push(stem);
    }
    const flowerColors = [0xffe06a, 0xf36e58, 0xfff4dc, 0xe792bd];
    for (let i = 0; i < 9; i++) {
      const flower = new THREE.Group();
      const petalMat = standard(flowerColors[i % flowerColors.length], 0.68);
      for (let p = 0; p < 5; p++) {
        const petal = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 6), petalMat);
        const a = p / 5 * Math.PI * 2;
        petal.scale.set(1.4, 0.42, 0.72);
        petal.position.set(Math.cos(a) * 0.075, 0, Math.sin(a) * 0.075);
        petal.rotation.y = -a;
        flower.add(petal);
      }
      const center = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), standard(0x8c5e25, 0.8));
      flower.add(center);
      flower.position.set((random() - 0.5) * 0.42, 0.67 + random() * 0.25, (random() - 0.5) * 0.36);
      flower.scale.setScalar(0.75 + random() * 0.55);
      basket.add(flower);
    }
    setShadows(basket, true, false);
    bike.add(basket);

    // — Pelican ————————————————————————————————————————————————————————
    const pelican = new THREE.Group();
    bike.add(pelican);

    const featherWhite = standard(0xfffbef, 0.74);
    const featherShade = standard(0xebe9df, 0.78);
    const featherGray = standard(0xb9c4c1, 0.72);
    const beakOrange = standard(0xf5822c, 0.5);
    const beakLight = standard(0xffa94d, 0.53);
    const beakDark = standard(0xb94d1e, 0.55);
    const eyeBlack = standard(0x1b2222, 0.26, 0.04);
    const eyeWhite = standard(0xffffff, 0.3);
    const legOrange = standard(0xf19b31, 0.63);

    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 20), featherWhite);
    body.scale.set(0.82, 0.56, 0.5);
    body.position.set(-0.12, 2.42, 0);
    body.rotation.z = 0.09;
    pelican.add(body);

    const chest = new THREE.Mesh(new THREE.SphereGeometry(0.54, 22, 16), featherWhite);
    chest.scale.set(0.92, 1.04, 0.9);
    chest.position.set(0.38, 2.47, 0);
    pelican.add(chest);

    const neckCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.4, 2.66, 0),
      new THREE.Vector3(0.45, 2.9, 0.01),
      new THREE.Vector3(0.57, 3.06, 0.02),
      new THREE.Vector3(0.7, 3.16, 0.02)
    ]);
    const neck = new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 22, 0.235, 12, false), featherWhite);
    pelican.add(neck);

    const head = new THREE.Group();
    head.position.set(0.75, 3.25, 0);
    head.rotation.z = -0.07;
    pelican.add(head);
    const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.37, 22, 16), featherWhite);
    headMesh.scale.set(1.02, 0.96, 0.91);
    head.add(headMesh);

    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.32, 18, 14), featherShade);
    cheek.scale.set(0.9, 0.78, 0.89);
    cheek.position.set(0.02, -0.06, 0.04);
    head.add(cheek);

    // Long coral-orange bill and its stretchy pouch.
    const bill = new THREE.Mesh(new THREE.ConeGeometry(0.23, 1.22, 16), beakOrange);
    bill.rotation.z = -Math.PI / 2;
    bill.rotation.x = 0.045;
    bill.scale.set(1, 1, 0.67);
    bill.position.set(0.86, -0.015, 0.005);
    head.add(bill);
    const billTop = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.95, 5, 8), beakDark);
    billTop.rotation.z = Math.PI / 2;
    billTop.position.set(0.79, 0.085, 0);
    billTop.scale.z = 0.55;
    head.add(billTop);
    const pouch = new THREE.Mesh(new THREE.SphereGeometry(0.4, 22, 14), beakLight);
    pouch.scale.set(1.26, 0.53, 0.72);
    pouch.position.set(0.66, -0.22, 0);
    pouch.rotation.z = 0.045;
    head.add(pouch);
    const pouchFold = tube([
      new THREE.Vector3(0.18, -0.29, 0.23),
      new THREE.Vector3(0.7, -0.36, 0.2),
      new THREE.Vector3(1.19, -0.19, 0.08)
    ], 0.012, beakDark, 16, 6);
    head.add(pouchFold);
    const billTip = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.19, 10), beakDark);
    billTip.rotation.z = -Math.PI / 2;
    billTip.position.set(1.48, -0.005, 0);
    head.add(billTip);

    // Eyes, brows, and a cheerful little crest.
    for (const side of [-1, 1]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.066, 14, 10), eyeBlack);
      eye.position.set(0.24, 0.13, side * 0.255);
      head.add(eye);
      const glint = new THREE.Mesh(new THREE.SphereGeometry(0.021, 8, 6), eyeWhite);
      glint.position.set(0.265, 0.155, side * 0.305);
      head.add(glint);
      const brow = new THREE.Mesh(new THREE.CapsuleGeometry(0.018, 0.13, 4, 6), featherGray);
      brow.rotation.z = Math.PI / 2 - side * 0.12;
      brow.position.set(0.225, 0.228, side * 0.254);
      head.add(brow);
    }
    for (let i = 0; i < 3; i++) {
      const crest = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.29, 7), featherShade);
      crest.position.set(-0.25 + i * 0.065, 0.31 + i * 0.01, (i - 1) * 0.08);
      crest.rotation.z = 0.72 + i * 0.18;
      crest.rotation.x = (i - 1) * 0.25;
      head.add(crest);
    }

    // A jaunty straw hat with a blue ribbon.
    const hat = new THREE.Group();
    hat.position.set(-0.08, 0.34, 0);
    hat.rotation.z = -0.08;
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.49, 0.5, 0.045, 28), standard(0xe8bf72, 0.86));
    brim.position.y = 0.06;
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.29, 24), standard(0xf0cc80, 0.82));
    crown.position.y = 0.2;
    const ribbon = new THREE.Mesh(new THREE.TorusGeometry(0.315, 0.035, 7, 28), standard(0x4b9fb1, 0.7));
    ribbon.rotation.x = Math.PI / 2;
    ribbon.position.y = 0.12;
    hat.add(brim, crown, ribbon);
    head.add(hat);

    // Scarf band and two fluttering tails.
    const scarfMat = standard(0xffc94d, 0.72);
    const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.065, 8, 28), scarfMat);
    scarf.position.set(0.48, 2.86, 0);
    scarf.rotation.x = Math.PI / 2;
    scarf.rotation.z = -0.12;
    pelican.add(scarf);
    const scarfTails = [];
    for (let i = 0; i < 2; i++) {
      const tailGeo = new THREE.BufferGeometry();
      tailGeo.setAttribute('position', new THREE.Float32BufferAttribute([
        0, 0, 0, -0.54, -0.08, 0.08, -0.18, 0.03, 0.17,
        0, 0, 0.07, -0.54, -0.08, 0.15, -0.18, 0.03, 0.24
      ], 3));
      tailGeo.setIndex([0, 1, 2, 3, 4, 5]);
      tailGeo.computeVertexNormals();
      const tail = new THREE.Mesh(tailGeo, scarfMat);
      tail.position.set(0.28, 2.88, (i - 0.5) * 0.13);
      tail.rotation.y = (i - 0.5) * 0.28;
      pelican.add(tail);
      scarfTails.push(tail);
    }

    // Folded tail feathers.
    for (let i = 0; i < 4; i++) {
      const tailFeather = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.72, 8), i > 1 ? featherShade : featherWhite);
      tailFeather.rotation.z = Math.PI / 2 - 0.25;
      tailFeather.rotation.x = (i - 1.5) * 0.17;
      tailFeather.position.set(-0.9, 2.45 + (i - 1.5) * 0.045, (i - 1.5) * 0.09);
      tailFeather.scale.z = 0.55;
      pelican.add(tailFeather);
    }

    // Wings reaching the handlebar grips.
    const wingGroups = [];
    for (const side of [-1, 1]) {
      const wing = new THREE.Group();
      wing.position.set(0.35, 2.61, side * 0.43);
      wing.rotation.x = side * -0.08;
      const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.65, 7, 12), featherWhite);
      upper.rotation.z = -1.0;
      upper.rotation.y = side * 0.12;
      upper.position.set(0.23, -0.17, 0);
      upper.scale.z = 0.72;
      wing.add(upper);
      for (let i = 0; i < 4; i++) {
        const feather = new THREE.Mesh(new THREE.CapsuleGeometry(0.062, 0.35 + i * 0.055, 5, 8), i === 3 ? featherShade : featherWhite);
        feather.rotation.z = -1.08 - i * 0.035;
        feather.rotation.x = side * (0.1 + i * 0.035);
        feather.position.set(0.56 + i * 0.035, -0.4 - i * 0.01, i * 0.023);
        feather.scale.z = 0.6;
        wing.add(feather);
      }
      const wingTip = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 10), featherGray);
      wingTip.scale.set(1.1, 0.52, 0.5);
      wingTip.position.set(0.67, -0.58, 0.01);
      wing.add(wingTip);
      pelican.add(wing);
      wingGroups.push(wing);
    }

    // Two articulated orange legs.
    const legs = [];
    for (const side of [-1, 1]) {
      const upperLeg = unitSegment(0.038, legOrange, 8);
      const lowerLeg = unitSegment(0.032, legOrange, 8);
      const foot = new THREE.Group();
      const ankle = new THREE.Mesh(new THREE.SphereGeometry(0.055, 9, 7), legOrange);
      foot.add(ankle);
      for (let i = 0; i < 3; i++) {
        const toe = new THREE.Mesh(new THREE.CapsuleGeometry(0.019, 0.17, 4, 6), legOrange);
        toe.rotation.z = Math.PI / 2;
        toe.rotation.y = (i - 1) * 0.34;
        toe.position.set(0.09, -0.006, (i - 1) * 0.055);
        foot.add(toe);
      }
      bike.add(upperLeg, lowerLeg, foot);
      legs.push({ side, upperLeg, lowerLeg, foot, hip: new THREE.Vector3(-0.08, 1.98, side * 0.27) });
    }

    setShadows(pelican, true, true);
    setShadows(bike, true, true);

    // Soft contact shadow to anchor the rider to the sand.
    const blobTexture = makeCanvasTexture(256, 128, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      const g = ctx.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2);
      g.addColorStop(0, 'rgba(52,35,21,0.74)');
      g.addColorStop(0.45, 'rgba(52,35,21,0.28)');
      g.addColorStop(1, 'rgba(52,35,21,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });
    const contactShadow = new THREE.Mesh(
      new THREE.PlaneGeometry(4.7, 1.7),
      new THREE.MeshBasicMaterial({ map: blobTexture, transparent: true, opacity: 0.48, depthWrite: false })
    );
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.set(0.1, 0.028, 0.1);
    world.add(contactShadow);

    // — Animation ————————————————————————————————————————————————————————
    const cursor = new THREE.Vector2();
    let cursorTarget = new THREE.Vector2();
    window.addEventListener('pointermove', (event) => {
      cursorTarget.x = (event.clientX / window.innerWidth - 0.5) * 2;
      cursorTarget.y = (event.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });
    window.addEventListener('pointerleave', () => { cursorTarget.set(0, 0); }, { passive: true });

    let reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function solveLeg(leg, pedalPosition, pedalAngle, hipYOffset = 0) {
      const hip = tempB.set(leg.hip.x, leg.hip.y + hipYOffset, leg.hip.z);
      const footPosition = tempC.set(pedalPosition.x, pedalPosition.y + 0.07, leg.side * 0.19);
      const target = tempD.copy(footPosition).sub(hip);
      const distance = Math.max(0.001, target.length());
      const upperLength = 0.81;
      const lowerLength = 0.85;
      target.normalize();
      const along = (upperLength * upperLength - lowerLength * lowerLength + distance * distance) / (2 * distance);
      const height = Math.sqrt(Math.max(0.0001, upperLength * upperLength - along * along));
      const knee = new THREE.Vector3().copy(hip).addScaledVector(target, along);
      // Bend the knee forward along the bicycle's direction of travel.
      const bend = new THREE.Vector3(-target.y, target.x, 0).normalize();
      knee.addScaledVector(bend, height);
      setSegment(leg.upperLeg, hip, knee);
      setSegment(leg.lowerLeg, knee, footPosition);
      leg.foot.position.copy(footPosition);
      leg.foot.position.y += 0.025;
      leg.foot.rotation.z = -pedalAngle * 0.12;
    }

    function updateScene(elapsed, delta) {
      const motion = reduceMotion ? 0.22 : 1;
      const rideTime = elapsed * motion;
      const wheelAngle = rideTime * 2.55;
      rearWheel.rotation.z = -wheelAngle;
      frontWheel.rotation.z = -wheelAngle;

      const pedalAngle = rideTime * 1.45;
      const crankRadius = 0.31;
      const pedalCenter = new THREE.Vector3(crank.x, crank.y, 0);
      for (let i = 0; i < 2; i++) {
        const angle = pedalAngle + i * Math.PI;
        crankGroups[i].rotation.z = angle;
        pedals[i].rotation.z = -angle;
        const px = pedalCenter.x + Math.cos(angle) * crankRadius;
        const py = pedalCenter.y + Math.sin(angle) * crankRadius;
        solveLeg(legs[i], new THREE.Vector3(px, py, i === 0 ? -0.19 : 0.19), angle, Math.sin(rideTime * 2.9) * 0.008);
      }

      // The rider gently rocks to the rhythm of the pedals.
      pelican.position.y = Math.sin(rideTime * 1.45) * 0.012;
      pelican.rotation.z = Math.sin(rideTime * 1.45) * 0.008;
      head.rotation.y = Math.sin(rideTime * 0.53) * 0.055 + cursor.x * 0.05;
      head.rotation.z = -0.07 + Math.sin(rideTime * 0.37) * 0.015;
      for (let i = 0; i < scarfTails.length; i++) {
        scarfTails[i].rotation.x = Math.sin(rideTime * 1.7 + i * 0.9) * 0.09;
        scarfTails[i].rotation.z = Math.sin(rideTime * 1.45 + i * 1.1) * 0.12;
      }
      for (let i = 0; i < wingGroups.length; i++) {
        wingGroups[i].rotation.z = Math.sin(rideTime * 0.7 + i * 1.4) * 0.018;
      }
      bike.position.x = Math.sin(rideTime * 0.21) * 0.1;
      contactShadow.position.x = bike.position.x + 0.1;
      contactShadow.scale.x = 1 + Math.sin(rideTime * 1.45) * 0.012;

      oceanMaterial.uniforms.uTime.value = elapsed * motion;
      foamA.position.z = Math.sin(elapsed * 0.55) * 0.16;
      foamB.position.z = Math.sin(elapsed * 0.42 + 1.6) * 0.22;

      for (const frond of (leftPalm.userData.fronds || [])) {
        frond.rotation.x = Math.sin(elapsed * 0.72 + frond.userData.phase) * 0.032;
      }
      for (const frond of (backPalm.userData.fronds || [])) {
        frond.rotation.x = Math.sin(elapsed * 0.62 + frond.userData.phase) * 0.028;
      }

      sailboat.position.y = Math.sin(elapsed * 0.55) * 0.09 - 0.02;
      sailboat.rotation.z = Math.sin(elapsed * 0.42 + 0.3) * 0.018;
      for (const gull of gulls) {
        gull.position.x += delta * gull.userData.speed * motion;
        if (gull.position.x > 25) gull.position.x = -18;
        gull.position.y = gull.userData.baseY + Math.sin(elapsed * 0.9 + gull.userData.phase) * 0.35;
      }
      for (const cloud of clouds) {
        cloud.position.x = cloud.userData.baseX + Math.sin(elapsed * cloud.userData.speed + cloud.position.z) * 4.0;
      }

      const idle = new THREE.Vector3(
        Math.sin(elapsed * 0.16) * 0.22,
        Math.sin(elapsed * 0.21 + 0.8) * 0.065,
        0
      );
      const mobile = window.innerWidth / window.innerHeight < 0.75;
      const base = mobile ? new THREE.Vector3(7.55, 4.12, 10.75) : new THREE.Vector3(6.2, 3.55, 8.4);
      cursor.lerp(cursorTarget, 0.035);
      const parallax = new THREE.Vector3(cursor.x * 0.28, -cursor.y * 0.12, 0);
      camera.position.lerp(base.add(idle).add(parallax), 0.055);
      camera.lookAt(lookTarget.x + idle.x * 0.17, lookTarget.y + idle.y, lookTarget.z);
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const aspect = width / height;
      const mobile = aspect < 0.75;
      camera.aspect = aspect;
      camera.fov = mobile ? 50 : 38;
      if (mobile) {
        cameraBase.set(7.55, 4.12, 10.75);
        lookTarget.set(0.02, 2.0, 0);
      } else {
        cameraBase.set(6.2, 3.55, 8.4);
        lookTarget.set(0.05, 1.95, 0);
      }
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    let firstFrame = true;
    renderer.setAnimationLoop(() => {
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;
      updateScene(elapsed, delta);
      renderer.render(scene, camera);
      if (firstFrame) {
        firstFrame = false;
        requestAnimationFrame(() => loading.classList.add('is-gone'));
      }
    });
  </script>
</body>
</html>
