<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080c12" />
    <meta
      name="description"
      content="Rackline is a two-rack 42U equipment placement planner with live power budgets, validation, and CSV export."
    />
    <title>Rackline — 42U Rack Planner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b111a'/%3E%3Cpath d='M8 6v20M16 6v20M24 6v20' stroke='%23c9f36b' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three/three.module.js",
          "three/addons/": "../../vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="./" aria-label="Rackline home">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="brand-copy">
          <strong>RACKLINE</strong>
          <small>42U DEPLOYMENT PLANNER</small>
        </span>
      </a>

      <div class="header-actions">
        <div class="save-state" id="saveState" aria-live="polite">
          <span class="save-dot"></span>
          <span>Saved locally</span>
        </div>
        <button class="button button-quiet reset-button" id="resetButton" type="button" title="Reset to the sample layout" aria-label="Reset to the sample layout">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M4.2 6.6A6.4 6.4 0 1 1 3.7 12" />
            <path d="M4.2 2.8v3.8H8" />
          </svg>
          <span>Reset</span>
        </button>
        <button class="button button-accent" id="exportButton" type="button" title="Export inventory as CSV" aria-label="Export inventory as CSV">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 2.5v10.2" />
            <path d="m6.5 9.2 3.5 3.5 3.5-3.5" />
            <path d="M3.5 15.7h13" />
          </svg>
          <span>Export CSV</span>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="scene-panel" aria-labelledby="sceneTitle">
        <div class="scene-toolbar">
          <div class="scene-title-wrap">
            <span class="eyebrow"><i class="live-dot"></i> Live elevation</span>
            <h1 id="sceneTitle">Rack topology</h1>
          </div>
          <div class="view-switch" role="group" aria-label="Camera view">
            <button type="button" class="is-active" data-view="front" aria-pressed="true">
              <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 4.5h13v9h-13z" /><path d="M5 7h8M5 9h8M5 11h8" /></svg>
              Front
            </button>
            <button type="button" data-view="rear" aria-pressed="false">
              <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 4.5h13v9h-13z" /><path d="M5 7h2M11 7h2M5 10h2M11 10h2" /></svg>
              Rear
            </button>
          </div>
        </div>

        <div class="scene-viewport" id="sceneViewport">
          <div class="viewport-grid" aria-hidden="true"></div>
          <div class="scene-loading" id="sceneLoading">
            <span class="loader-ring"></span>
            <span>Building rack geometry</span>
          </div>
          <div class="viewport-hint" id="viewportHint">
            <span class="hint-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20"><path d="M7.6 5.8V4.2a1.6 1.6 0 0 1 3.2 0v5.4" /><path d="M10.8 8.8V3.7a1.6 1.6 0 0 1 3.2 0v5.6" /><path d="M14 8.1a1.6 1.6 0 0 1 3.2 0v4.1a5.8 5.8 0 0 1-5.8 5.8h-.5a5 5 0 0 1-4-2l-3-4a1.6 1.6 0 0 1 2.4-2.1l2.3 2V5.8a1.6 1.6 0 0 1 3.2 0" /></svg>
            </span>
            <span class="hint-desktop"><b>Drag</b> gear to move · <b>Click</b> a free U to place · <b>Scroll</b> to zoom</span>
            <span class="hint-mobile"><b>Tap</b> to select · <b>Drag</b> to move</span>
          </div>
          <div class="drag-readout" id="dragReadout" hidden></div>
          <div class="view-badge" id="viewBadge">
            <span>FRONT</span>
            <small>42U · 2 RACKS</small>
          </div>
        </div>

        <div class="rack-summary-grid" id="rackSummaryGrid" aria-live="polite"></div>
      </section>

      <aside class="control-panel" aria-label="Rack planning controls">
        <section class="panel-section catalog-section" aria-labelledby="equipmentHeading">
          <div class="section-heading">
            <div>
              <span class="section-index">01</span>
              <h2 id="equipmentHeading">Equipment</h2>
            </div>
            <span class="section-note">Select, then place</span>
          </div>

          <div class="catalog-grid" id="catalogGrid"></div>

          <form class="placement-form" id="placementForm" novalidate>
            <div class="placement-fields">
              <div class="field">
                <span class="field-label">Target rack</span>
                <div class="compact-switch" id="rackTargetSwitch" role="group" aria-label="Target rack">
                  <button type="button" class="is-active" data-rack-target="A" aria-pressed="true">Rack A</button>
                  <button type="button" data-rack-target="B" aria-pressed="false">Rack B</button>
                </div>
              </div>
              <label class="field field-unit" for="startUnit">
                <span class="field-label">Start unit</span>
                <span class="unit-field">
                  <span>U</span>
                  <input id="startUnit" name="startUnit" type="number" inputmode="numeric" min="1" max="42" step="1" value="20" />
                </span>
              </label>
            </div>
            <button class="button button-primary place-button" id="addButton" type="submit">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.2v13.6M3.2 10h13.6" /></svg>
              <span id="addButtonLabel">Place compute server</span>
            </button>
          </form>
        </section>

        <section class="panel-section selection-section" aria-labelledby="selectionHeading">
          <div class="section-heading">
            <div>
              <span class="section-index">02</span>
              <h2 id="selectionHeading">Selection</h2>
            </div>
            <span class="selection-badge" id="selectionBadge">None</span>
          </div>
          <div id="selectionContent" class="selection-content"></div>
        </section>

        <section class="panel-section rack-map-section" aria-labelledby="mapHeading">
          <div class="section-heading">
            <div>
              <span class="section-index">03</span>
              <h2 id="mapHeading">Unit map</h2>
            </div>
            <div class="legend" aria-label="Unit map legend">
              <span><i class="legend-free"></i>Free</span>
              <span><i class="legend-used"></i>Used</span>
            </div>
          </div>
          <div class="rack-list-grid" id="rackListGrid"></div>
        </section>
      </aside>
    </main>

    <div class="toast-region" id="toastRegion" aria-live="assertive" aria-atomic="true"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
